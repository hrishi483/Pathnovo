[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delta-chat"
version = "0.1.0"
description = "Loss-aware canonical extraction for engineering-document revision comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3",
  "fastapi>=0.116",
  "google-genai",
  "jinja2>=3.1",
  "httpx>=0.28",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "pydantic>=2.10",
  "pymupdf>=1.25",
  "python-multipart>=0.0.20",
  "python-dotenv",
  "uvicorn[standard]>=0.34",
  "langsmith==0.10.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
